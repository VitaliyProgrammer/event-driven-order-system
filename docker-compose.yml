x-service-environment: &service-environment
  DB_HOST: postgres
  DB_USERNAME: ${DB_USERNAME:-orderline}
  DB_PASSWORD: ${DB_PASSWORD:-orderline}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}

x-service-dependencies: &service-dependencies
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-orderline}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orderline}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-orderline} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      start_period: 60s
      interval: 15s
      timeout: 30s
      retries: 10

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: orderline
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        MODULE: order-service
    ports:
      - "8081:8081"
    environment:
      <<: *service-environment
      DB_NAME: order_db
      ADMINISTRATOR_EMAIL: ${ADMINISTRATOR_EMAIL:-admin@orderline.local}
      ADMINISTRATOR_PASSWORD: ${ADMINISTRATOR_PASSWORD:-administrator}
      PAYMENT_TIMEOUT: ${PAYMENT_TIMEOUT:-15m}
    depends_on: *service-dependencies

  inventory-service:
    build:
      context: .
      args:
        MODULE: inventory-service
    ports:
      - "8082:8082"
    environment:
      <<: *service-environment
      DB_NAME: inventory_db
    depends_on: *service-dependencies

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    ports:
      - "8083:8083"
    environment:
      <<: *service-environment
      DB_NAME: notification_db
    depends_on: *service-dependencies

volumes:
  postgres-data:
