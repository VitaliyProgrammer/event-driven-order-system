name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and run tests
        shell: bash
        run: ./mvnw -B verify | tee build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: grep -E "\[ERROR\]" build.log | grep -v -E "^\[ERROR\] *$|Help 1|-e switch|-X switch|full stack trace|re-run Maven|resume the build|For more information|After correcting" | head -10 | sed 's/^/::error::/'
