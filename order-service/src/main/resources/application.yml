spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}
    username: ${DB_USERNAME:orderline}
    password: ${DB_PASSWORD:orderline}
  jpa:
    # Keep DB access inside the service layer; lazy loading from a controller hides N+1 queries.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
